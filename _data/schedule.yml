# Program of the day, rendered on /program/.
#
# Each entry is one row. Fields:
#   time, end      "HH:MM" strings (keep the quotes)
#   type           talk | open-problem | poster | break
#                  (break is used for welcome, lunch, coffee, closing: shown greyed out)
#   title          talk title / session name (empty -> "To be announced")
#   speaker        name of the speaker or presenter (optional)
#   speaker_url    link on the speaker's name (optional)
#   affiliation    shown in parentheses after the name (optional)
#   description    one line shown under the title (optional)
#   abstract       shown in a collapsible "Abstract" box; Markdown allowed (optional)
#   slides         link or path to slides, e.g. /assets/slides/talk1.pdf (optional)
#
# Empty fields are simply not displayed.

